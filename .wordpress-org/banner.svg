      <stop offset="0" stop-color="#1f2733"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <!-- transparent outside the 500-tall band; content centered for a clean center-crop -->
  <g transform="translate(0,522)">
