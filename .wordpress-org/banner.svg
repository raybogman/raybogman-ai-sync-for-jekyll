      <text x="541" y="382">GitHub OAuth</text>
      <rect x="658" y="348" width="189" height="52" rx="26" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
      <text x="752" y="382">Style-aware</text>
      <rect x="863" y="348" width="202" height="52" rx="26" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5"/>
