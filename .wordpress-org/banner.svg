      <tspan fill="#f67c07">AI</tspan><tspan fill="#ffffff"> Sync for Jekyll &amp; GitHub Pages</tspan>
    </text>

    <text x="440" y="300" font-family="Helvetica, Arial, sans-serif" font-weight="400" font-size="27" fill="#9aa6b4">AI-assisted WordPress &#8594; Jekyll on GitHub Pages sync. One click.</text>

